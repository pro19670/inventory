<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humin - 차세대 AI 트윈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --neural-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --surface-gradient: linear-gradient(145deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            --text-primary: #ffffff;
            --text-secondary: #b4b4b4;
            --surface-primary: rgba(255,255,255,0.08);
            --surface-secondary: rgba(255,255,255,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* 애니메이션 배경 */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-gradient);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* 고급 헤더 */
        .header {
            padding: 60px 24px 30px 24px;
            background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(102,126,234,0.2) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .header-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 16px;
            position: relative;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #667eea 50%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        .tagline {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            opacity: 0.9;
            margin-top: 8px;
        }

        .status-indicator {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(67,233,123,0.1);
            border: 1px solid rgba(67,233,123,0.3);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neural-gradient);
            border-radius: 50%;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(67,233,123,0.5); }
            50% { box-shadow: 0 0 20px rgba(67,233,123,0.8); }
        }

        /* AI 채팅 카드 - 3D 효과 */
        .ai-chat-card {
            background: var(--surface-gradient);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.2);
            margin: 0 24px 32px 24px;
            padding: 28px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .ai-chat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 24px;
        }

        .ai-chat-card:hover::before {
            opacity: 0.1;
        }

        .ai-chat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(102,126,234,0.3);
            border-color: rgba(102,126,234,0.5);
        }

        .ai-chat-content {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .ai-avatar {
            width: 64px;
            height: 64px;
            background: var(--primary-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(102,126,234,0.4);
            position: relative;
            overflow: hidden;
        }

        .ai-avatar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }

        .ai-chat-info h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #b4b4b4 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-chat-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* 섹션 카드 - 네오모피즘 */
        .main-section {
            background: var(--surface-gradient);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1);
            margin: 0 24px 28px 24px;
            padding: 32px;
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .main-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .main-section:hover::before {
            transform: scaleX(1);
        }

        .main-section:hover {
            background: linear-gradient(145deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.08) 100%);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .section-icon {
            width: 56px;
            height: 56px;
            background: var(--surface-gradient);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
        }

        .section-icon:hover {
            background: var(--primary-gradient);
            transform: rotate(5deg) scale(1.05);
        }

        .section-title h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
        }

        .add-space-btn {
            width: 56px;
            height: 56px;
            background: var(--neural-gradient);
            border: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 24px rgba(67,233,123,0.3);
        }

        .add-space-btn:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 12px 32px rgba(67,233,123,0.5);
        }

        /* 홈 박스 - 홀로그램 효과 */
        .home-box {
            background: linear-gradient(145deg, rgba(67,233,123,0.1) 0%, rgba(56,249,215,0.1) 100%);
            border: 1px solid rgba(67,233,123,0.3);
            padding: 24px 28px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .home-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            transition: left 0.5s ease;
        }

        .home-box:hover::before {
            left: 100%;
        }

        .home-box:hover {
            background: linear-gradient(145deg, rgba(67,233,123,0.2) 0%, rgba(56,249,215,0.2) 100%);
            border-color: rgba(67,233,123,0.6);
            transform: translateX(8px) scale(1.02);
            box-shadow: 0 16px 32px rgba(67,233,123,0.2);
        }

        /* 상태 카드 - 홀로그램 스타일 */
        .status-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 28px 0;
        }

        .status-card {
            background: var(--surface-gradient);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 28px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .status-card.normal::before {
            background: var(--neural-gradient);
        }

        .status-card.warning::before {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .status-card.danger::before {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .status-card:hover::before {
            width: 200%;
            height: 200%;
            opacity: 0.1;
        }

        .status-card:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .status-card .count {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .status-card.normal .count {
            background: var(--neural-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card.warning .count {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card.danger .count {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        /* 알림 아이템 - 더 프리미엄한 스타일 */
        .low-stock-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .low-stock-item {
            background: var(--surface-gradient);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239,68,68,0.2);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .low-stock-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--secondary-gradient);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .low-stock-item:hover::before {
            transform: scaleY(1);
        }

        .low-stock-item:hover {
            background: linear-gradient(145deg, rgba(239,68,68,0.05) 0%, rgba(220,38,38,0.05) 100%);
            border-color: rgba(239,68,68,0.4);
            transform: translateX(12px);
            box-shadow: 0 16px 32px rgba(239,68,68,0.15);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .item-icon {
            font-size: 28px;
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, rgba(239,68,68,0.1) 0%, rgba(220,38,38,0.1) 100%);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .low-stock-item:hover .item-icon {
            background: linear-gradient(145deg, rgba(239,68,68,0.2) 0%, rgba(220,38,38,0.2) 100%);
            transform: scale(1.1);
        }

        .item-details h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .item-status {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .item-action {
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .low-stock-item:hover .item-action {
            transform: scale(1.2) rotate(10deg);
        }

        /* 추가된 공간 스타일 */
        .added-spaces {
            margin-top: 20px;
        }

        .added-space-item {
            background: linear-gradient(145deg, rgba(67,233,123,0.1) 0%, rgba(56,249,215,0.1) 100%);
            border: 1px solid rgba(67,233,123,0.2);
            padding: 20px 24px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .added-space-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: var(--neural-gradient);
            transition: width 0.3s ease;
        }

        .added-space-item:hover::before {
            width: 4px;
        }

        .added-space-item:hover {
            background: linear-gradient(145deg, rgba(67,233,123,0.15) 0%, rgba(56,249,215,0.15) 100%);
            border-color: rgba(67,233,123,0.4);
            transform: translateX(8px);
        }

        /* 앱 바로가기 스타일 */
        .app-shortcuts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 20px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            background: var(--surface-gradient);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .app-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .app-item:hover::before {
            opacity: 1;
        }

        .app-item:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.2);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .app-item:hover .app-icon {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
        }

        .app-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            position: relative;
            z-index: 1;
            opacity: 0.9;
            line-height: 1.2;
        }

        .app-item:hover .app-name {
            opacity: 1;
        }

        .app-item.add-app:hover .app-icon {
            background: var(--primary-gradient) !important;
            border: none !important;
            color: white;
            transform: scale(1.15) rotate(180deg);
        }

        /* 반응형 - 앱 그리드 */
        @media (max-width: 350px) {
            .app-shortcuts {
                gap: 20px;
            }
            
            .app-item {
                padding: 20px 16px;
                gap: 12px;
            }
            
            .app-icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
                border-radius: 16px;
            }
            
            .app-name {
                font-size: 12px;
            }
        }

        /* 플로팅 네비게이션 - 더 미래적 */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 342px;
            background: linear-gradient(145deg, rgba(26,26,26,0.95) 0%, rgba(15,15,15,0.95) 100%);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 20px 28px;
            border-radius: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 20px;
        }

        .nav-item:hover::before {
            opacity: 0.1;
        }

        .nav-item:hover {
            color: var(--text-primary);
            transform: translateY(-4px) scale(1.05);
        }

        .nav-item.active {
            color: #667eea;
            background: linear-gradient(145deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
            border: 1px solid rgba(102,126,234,0.3);
        }

        .nav-icon {
            font-size: 22px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .nav-item:hover .nav-icon {
            transform: scale(1.2);
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 반응형 디자인 */
        @media (max-width: 390px) {
            .container {
                border-left: none;
                border-right: none;
            }
            
            .header {
                padding: 50px 20px 25px 20px;
            }
            
            .main-section {
                margin: 0 20px 24px 20px;
                padding: 28px;
            }
            
            .ai-chat-card {
                margin: 0 20px 28px 20px;
                padding: 24px;
            }
            
            .bottom-nav {
                width: calc(100% - 40px);
                max-width: none;
            }
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {

        // 애니메이션 배경 파티클 생성

            const bg = document.getElementById('animatedBg');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                bg.appendChild(particle);
            }
        }

        // 페이지 로드시 파티클 생성
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
        });

        // 전역 변수
        let addedSpaces = [];

        function openChatSlide() {
            // 대화창으로 이동 - 슬라이드 효과와 함께
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
                backdrop-filter: blur(20px);
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.3s ease;
            `;
            
            const message = document.createElement('div');
            message.style.cssText = `
                background: var(--surface-gradient);
                border: 1px solid rgba(255,255,255,0.2);
                padding: 40px;
                border-radius: 24px;
                text-align: center;
                color: white;
                font-size: 18px;
                font-weight: 600;
                transform: scale(0.8);
                transition: transform 0.3s ease;
            `;
            message.innerHTML = `
                <div style="font-size: 48px; margin-bottom: 16px;">🧠</div>
                <div>AI 채팅 기능 준비 중...</div>
                <div style="font-size: 14px; margin-top: 16px; opacity: 0.8;">곧 만나뵐게요!</div>
            `;
            
            overlay.appendChild(message);
            document.body.appendChild(overlay);
            
            // 애니메이션 실행
            setTimeout(() => {
                overlay.style.opacity = '1';
                message.style.transform = 'scale(1)';
            }, 10);
            
            // 3초 후 제거
            setTimeout(() => {
                overlay.style.opacity = '0';
                message.style.transform = 'scale(0.8)';
                setTimeout(() => overlay.remove(), 300);
            }, 3000);
            
            // 클릭시 즉시 제거
            overlay.onclick = () => {
                overlay.style.opacity = '0';
                message.style.transform = 'scale(0.8)';
                setTimeout(() => overlay.remove(), 300);
            };

        // 새 공간 추가 (사무실 자동 생성)
        function addNewSpace() {
            if (!addedSpaces.includes('사무실')) {
                addedSpaces.push('사무실');
                updateAddedSpaces();
                
                // 성공 알림 - 더 세련된 스타일
                showNotification('✨ 사무실이 성공적으로 추가되었습니다!', 'success');
            } else {
                showNotification('⚠️ 사무실이 이미 존재합니다.', 'warning');
            }
        }

        // 알림 표시 함수
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const colors = {
                success: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                warning: 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
                error: 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)',
                info: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
            };
            
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%) translateY(-100px);
                background: ${colors[type]};
                color: white;
                padding: 16px 24px;
                border-radius: 50px;
                font-weight: 600;
                font-size: 14px;
                z-index: 1000;
                box-shadow: 0 16px 32px rgba(0,0,0,0.3);
                backdrop-filter: blur(20px);
                transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
                opacity: 0;
            `;
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // 애니메이션 실행
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateX(-50%) translateY(0)';
            }, 10);
            
            // 3초 후 제거
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(-50%) translateY(-50px)';
                setTimeout(() => notification.remove(), 400);
            }, 3000);
        }

        // 추가된 공간들 UI 업데이트
        function updateAddedSpaces() {
            const container = document.getElementById('addedSpaces');
            container.innerHTML = '';
            
            addedSpaces.forEach((space, index) => {
                const spaceDiv = document.createElement('div');
                spaceDiv.className = 'added-space-item';
                spaceDiv.onclick = () => openSpaceDetail(space);
                spaceDiv.innerHTML = `🏢 ${space}`;
                spaceDiv.style.animationDelay = (index * 0.1) + 's';
                container.appendChild(spaceDiv);
            });
        }

                <div style="font-size: 48px; margin-bottom: 16px;">🚀</div>
                <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">${appName} 실행 중...</div>
                <div style="font-size: 14px; opacity: 0.8;">새 창에서 열립니다</div>
            `;
            
            document.body.appendChild(notification);
            
            // 애니메이션 실행
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 10);
            
            // 실제 앱 실행
            setTimeout(() => {
                window.open(url, '_blank');
                
                // 알림 제거
                notification.style.opacity = '0';
                notification.style.transform = 'translate(-50%, -50%) scale(0.8)';
                setTimeout(() => notification.remove(), 300);
                
                // 성공 알림
                setTimeout(() => {
                    showNotification(`✨ ${appName}이(가) 실행되었습니다!`, 'success');
                }, 500);
            }, 1000);
            
            // 클릭시 즉시 실행
            notification.onclick = () => {
                window.open(url, '_blank');
                notification.style.opacity = '0';
                notification.style.transform = 'translate(-50%, -50%) scale(0.8)';
                setTimeout(() => notification.remove(), 300);
                showNotification(`✨ ${appName}이(가) 실행되었습니다!`, 'success');
            };
        }

        // 앱 관리 관련 전역 변수
        let userApps = [
            { name: '쿠팡', url: 'https://www.coupang.com', icon: '🛒', gradient: 'linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%)' }
        ];

        // 새 앱 추가 함수 개선
        function addNewApp() {
            if (userApps.length >= 3) {
                showNotification('⚠️ 최대 3개의 앱만 추가할 수 있습니다', 'warning');
                return;
            }

            const appName = prompt('추가할 앱 이름을 입력하세요:', '');
            if (!appName || appName.trim() === '') return;

            const appUrl = prompt('앱 URL을 입력하세요 (예: https://example.com):', 'https://');
            if (!appUrl || appUrl === 'https://') return;

            // 아이콘 선택 (간단한 아이콘 목록 제공)
            const availableIcons = ['🛍️', '🍔', '☕', '💄', '📚', '🎵', '🎮', '💊', '🚗', '✈️'];
            const iconChoice = prompt(`아이콘을 선택하세요 (0-${availableIcons.length-1}):\n${availableIcons.map((icon, i) => `${i}: ${icon}`).join('\n')}`, '0');
            const selectedIcon = availableIcons[parseInt(iconChoice)] || '📱';

            // 색상 선택
            const availableGradients = [
                'linear-gradient(135deg, #00d2d3 0%, #54a0ff 100%)',
                'linear-gradient(135deg, #2ed573 0%, #7bed9f 100%)',
                'linear-gradient(135deg, #5f27cd 0%, #a55eea 100%)',
                'linear-gradient(135deg, #ff9ff3 0%, #f368e0 100%)',
                'linear-gradient(135deg, #ffa502 0%, #ff6348 100%)',
                'linear-gradient(135deg, #ff3838 0%, #ff4757 100%)'
            ];
            const randomGradient = availableGradients[Math.floor(Math.random() * availableGradients.length)];

            // 앱 추가
            const newApp = {
                name: appName.trim(),
                url: appUrl,
                icon: selectedIcon,
                gradient: randomGradient
            };

            userApps.push(newApp);
            updateAppShortcuts();
            showNotification(`✨ ${appName} 앱이 추가되었습니다!`, 'success');
        }

        // 앱 바로가기 UI 업데이트
        function updateAppShortcuts() {
            const container = document.getElementById('appShortcuts');
            container.innerHTML = '';

            userApps.forEach((app, index) => {
                const appDiv = document.createElement('div');
                appDiv.className = 'app-item';
                appDiv.onclick = () => openApp(app.name, app.url);
                appDiv.style.animationDelay = (index * 0.1) + 's';
                
                appDiv.innerHTML = `
                    <div class="app-icon" style="background: ${app.gradient};">${app.icon}</div>
                    <div class="app-name">${app.name}</div>
                `;
                
                container.appendChild(appDiv);
            });
        }

        function showHome() { setActiveNav(0); }
        function showLocation() { 
            setActiveNav(1); 
            showNotification('📍 위치 기반 물품 찾기 기능 활성화', 'info');
        }
        function showCategory() { 
            setActiveNav(2); 
            showNotification('🏷️ 카테고리별 스마트 분류 시스템', 'info');
        }
        function showInventory() { 
            setActiveNav(3); 
            showNotification('📦 AI 재고관리 시스템 실행 중', 'info');
        }
        function showItems() { 
            setActiveNav(4); 
            showNotification('➕ 물품 추가 - 음성/카메라 인식 지원', 'info');
        }
        function showSettings() { 
            setActiveNav(5); 
            showNotification('⚙️ Humin AI 설정 메뉴', 'info');
        }

        function setActiveNav(index) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 터치 제스처 지원
        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartY - touchEndY;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // 위로 스와이프 - 새로고침
                    showNotification('🔄 Humin 데이터 동기화 중...', 'info');
                }
            }
        }

        // 초기 로딩 애니메이션
        window.addEventListener('load', () => {
            // 앱 바로가기 초기화
            updateAppShortcuts();
            
            const elements = document.querySelectorAll('.main-section, .ai-chat-card');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    el.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 150);
            });
        });
    </script>
</body>
</html>
